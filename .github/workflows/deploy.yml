name: Deploy Bots (Docker)

on:
  push:
    tags:
      - 'v*'  # Trigger nur bei Version Tags (v1.0.0, v1.2.3, etc.)
  workflow_dispatch:  # Manueller Trigger

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'

    steps:
      - name: 📦 Checkout Repository
        uses: actions/checkout@v3

      - name: 🔑 Set up SSH Agent
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_KEY }}

      - name: 🌐 Add Server to Known Hosts
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KNOWN_HOSTS }}" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      #########################################
      # BACKUP CURRENT BOTS
      #########################################
      - name: 💾 Backup Current Bots
        run: |
          ssh -o StrictHostKeyChecking=yes ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} << 'EOF'
            cd ~/app
            
            if [ -d "bot-plattform" ]; then
              BACKUP_DIR=~/backups/bots_backup_$(date +%Y%m%d_%H%M%S)
              mkdir -p $BACKUP_DIR
              
              echo "📦 Backing up bots to $BACKUP_DIR"
              cp -r bot-plattform $BACKUP_DIR/
              
              # Backup docker/.env (wichtig!)
              if [ -f bot-plattform/docker/.env ]; then
                cp bot-plattform/docker/.env $BACKUP_DIR/.env
              fi
              
              echo "✅ Backup created"
            fi
          EOF

      #########################################
      # DEPLOY BOT CODE
      #########################################
      - name: 🤖 Deploy Bot Code
        run: |
          echo "📦 Deploying Bot Platform..."
          
          # Erstelle Verzeichnis
          ssh -o StrictHostKeyChecking=yes ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} \
            "mkdir -p /home/${{ secrets.SERVER_USER }}/app/bot-plattform"
          
          # Deploy komplettes Repo (außer .env!)
          rsync -av --delete \
            --exclude '__pycache__' \
            --exclude '*.pyc' \
            --exclude 'docker/.env' \
            --exclude '.env' \
            --exclude '.env.local' \
            --exclude '.venv' \
            --exclude 'venv' \
            --exclude '.git' \
            --exclude '.pytest_cache' \
            --exclude '*.log' \
            --exclude 'logs/' \
            -e "ssh -o StrictHostKeyChecking=yes" \
            ./ \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/home/${{ secrets.SERVER_USER }}/app/bot-plattform/
          
          echo "✅ Bot code deployed to ~/app/bot-plattform/"

      #########################################
      # REBUILD & RESTART DOCKER CONTAINERS
      #########################################
      - name: 🐳 Rebuild & Restart Bots
        run: |
          ssh -o StrictHostKeyChecking=yes ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} << 'EOF'
            cd ~/app/bot-plattform
            
            echo "🔨 Rebuilding Docker images..."
            
            # Build beide Bots neu (ohne cache für sauberen Build)
            docker compose build --no-cache twitch-bot
            docker compose build --no-cache discord-bot
            
            echo "✅ Images rebuilt"
            
            echo "🔄 Restarting bot containers..."
            
            # Restart beide Bots
            docker compose up -d twitch-bot discord-bot
            
            echo "✅ Bots restarted"
            
            # Warte kurz damit Container starten
            sleep 5
          EOF

      #########################################
      # VERIFY DEPLOYMENT
      #########################################
      - name: ✅ Verify Bot Status
        run: |
          ssh -o StrictHostKeyChecking=yes ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} << 'EOF'
            cd ~/app/bot-plattform
            
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "🔍 BOT STATUS CHECK"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo ""
            
            # Container Status
            echo "📊 Container Status:"
            docker compose ps
            
            echo ""
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "📋 TWITCH BOT LOGS (last 20 lines):"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            docker compose logs twitch-bot --tail=20
            
            echo ""
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "📋 DISCORD BOT LOGS (last 20 lines):"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            docker compose logs discord-bot --tail=20
            
            echo ""
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "✅ Deployment Verification Complete"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          EOF

      #########################################
      # CHECK BOT HEALTH
      #########################################
      - name: 🏥 Health Check
        run: |
          ssh -o StrictHostKeyChecking=yes ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} << 'EOF'
            cd ~/app/bot-plattform
            
            # Check if containers are running
            TWITCH_STATUS=$(docker compose ps twitch-bot --format json | jq -r '.State' 2>/dev/null || echo "unknown")
            DISCORD_STATUS=$(docker compose ps discord-bot --format json | jq -r '.State' 2>/dev/null || echo "unknown")
            
            echo "🏥 Health Status:"
            echo "  Twitch Bot:  $TWITCH_STATUS"
            echo "  Discord Bot: $DISCORD_STATUS"
            
            # Exit with error if any bot is not running
            if [ "$TWITCH_STATUS" != "running" ]; then
              echo "❌ Twitch Bot is not running!"
              exit 1
            fi
            
            if [ "$DISCORD_STATUS" != "running" ]; then
              echo "❌ Discord Bot is not running!"
              exit 1
            fi
            
            echo "✅ All bots are healthy!"
          EOF

      #########################################
      # DEPLOYMENT SUMMARY
      #########################################
      - name: 🎉 Deployment Summary
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "✅ BOT PLATFORM DEPLOYMENT COMPLETED"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""
          echo "📦 Deployed Version: ${{ github.ref_name }}"
          echo "📝 Commit: ${{ github.sha }}"
          echo "📂 Location: ~/app/bot-plattform/"
          echo ""
          echo "🤖 Bots Deployed:"
          echo "  ✅ Twitch Bot  (services/twitch-bot/)"
          echo "  ✅ Discord Bot (services/discord-bot/)"
          echo ""
          echo "🔍 Quick Commands:"
          echo "  • Status:  docker compose ps"
          echo "  • Logs:    docker compose logs -f"
          echo "  • Restart: docker compose restart"
          echo ""
          echo "📊 Check Logs:"
          echo "  • Twitch:  docker compose logs twitch-bot -f"
          echo "  • Discord: docker compose logs discord-bot -f"
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"