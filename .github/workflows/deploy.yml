name: Deploy Bot Platform

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 📦 Checkout Repository
        uses: actions/checkout@v3

      - name: 🔑 Set up SSH Agent
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_KEY }}

      - name: 🌐 Add Server to Known Hosts
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KNOWN_HOSTS }}" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      #########################################
      # BACKUP CURRENT DEPLOYMENT
      #########################################
      - name: 💾 Backup Current Deployment
        run: |
          ssh -o StrictHostKeyChecking=yes ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} << 'EOF'
            if [ -d /home/${{ secrets.SERVER_USER }}/app/bot-plattform ]; then
              BACKUP_DIR=/home/${{ secrets.SERVER_USER }}/backups/bot_backup_$(date +%Y%m%d_%H%M%S)
              mkdir -p $BACKUP_DIR
              
              echo "📦 Backing up to $BACKUP_DIR"
              cp -r /home/${{ secrets.SERVER_USER }}/app/bot-plattform $BACKUP_DIR/
              
              # Backup .env file
              if [ -f /home/${{ secrets.SERVER_USER }}/app/bot-plattform/docker/.env ]; then
                cp /home/${{ secrets.SERVER_USER }}/app/bot-plattform/docker/.env $BACKUP_DIR/.env
              fi
              
              echo "✅ Backup created"
            else
              echo "ℹ️  First deployment - no backup needed"
            fi
          EOF

      - name: 🚚 Transfer Code to Server
        run: |
          rsync -avz --exclude '.git*' --exclude 'backups' ./ ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/home/${{ secrets.SERVER_USER }}/app/bot-plattform/

      #########################################
      # CREATE DIRECTORIES & NETWORK
      #########################################
      - name: 🏗️ Setup Server Environment
        run: |
          ssh -o StrictHostKeyChecking=yes ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} << 'EOF'
            echo "🏗️  Setting up server environment..."
            
            # Create directories
            mkdir -p /home/${{ secrets.SERVER_USER }}/app/bot-plattform
            mkdir -p /home/${{ secrets.SERVER_USER }}/app/bot-plattform/docker
            mkdir -p /home/${{ secrets.SERVER_USER }}/backups
            
            # Create Docker network if not exists
            if ! docker network ls | grep -q goalkeeper_shared_network; then
              echo "🌐 Creating Docker network..."
              docker network create goalkeeper_shared_network
            fi
          EOF

      #########################################
      # RESTART DOCKER SERVICES
      #########################################
      - name: 🐳 Build & Restart Docker Containers
        run: |
          ssh -o StrictHostKeyChecking=yes ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} << 'EOF'
            cd /home/${{ secrets.SERVER_USER }}/app/bot-plattform
            
            echo "🔍 Checking docker-compose.yml..."
            if [ ! -f docker-compose.yml ]; then
              echo "❌ docker-compose.yml not found!"
              exit 1
            fi
            
            echo "🔨 Building Docker images..."
            docker compose build --no-cache
            
            echo "🔄 Starting containers..."
            docker compose down --remove-orphans
            docker compose up -d
            
            echo "🧹 Cleaning up old images..."
            docker image prune -f
            
            echo "✅ Deployment finished!"
          EOF

      #########################################
      # VERIFY STATUS
      #########################################
      - name: ✅ Verify Deployment
        run: |
          ssh -o StrictHostKeyChecking=yes ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} << 'EOF'
            cd /home/${{ secrets.SERVER_USER }}/app/bot-plattform
            
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "📊 Docker Container Status:"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            docker compose ps
            
            echo ""
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "📜 Recent Logs (Twitch Bot):"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            docker compose logs twitch-bot --tail=20
            
            echo ""
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "📜 Recent Logs (Discord Bot):"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            docker compose logs discord-bot --tail=20
          EOF

      #########################################
      # HEALTH CHECK
      #########################################
      - name: 🏥 Health Check
        run: |
          ssh -o StrictHostKeyChecking=yes ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} << 'EOF'
            cd /home/${{ secrets.SERVER_USER }}/app/bot-plattform
            
            # Wait for containers to start
            sleep 5
            
            # Check container status
            TWITCH_RUNNING=$(docker compose ps twitch-bot --format json 2>/dev/null | grep -c '"State":"running"' || echo "0")
            DISCORD_RUNNING=$(docker compose ps discord-bot --format json 2>/dev/null | grep -c '"State":"running"' || echo "0")
            
            echo "🏥 Health Status:"
            echo "  Twitch Bot:  $([ "$TWITCH_RUNNING" = "1" ] && echo "✅ Running" || echo "❌ Not Running")"
            echo "  Discord Bot: $([ "$DISCORD_RUNNING" = "1" ] && echo "✅ Running" || echo "❌ Not Running")"
            
            # Only fail if .env is properly configured
            if [ -f docker/.env ] && grep -q "REPLACE_ME" docker/.env; then
              echo ""
              echo "⚠️  .env file contains placeholder values!"
              echo "   Edit docker/.env with real values, then restart:"
              echo "   cd /home/${{ secrets.SERVER_USER }}/app/bot-plattform"
              echo "   docker compose up -d"
              exit 0  # Don't fail deployment, just warn
            fi
            
            # Fail if containers are not running and .env is configured
            if [ "$TWITCH_RUNNING" != "1" ] || [ "$DISCORD_RUNNING" != "1" ]; then
              echo ""
              echo "❌ One or more containers failed to start!"
              echo "   Check logs above for errors."
              exit 1
            fi
            
            echo ""
            echo "✅ All bots are healthy!"
          EOF

      #########################################
      # DEPLOYMENT SUMMARY
      #########################################
      - name: 🎉 Deployment Summary
        if: always()
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "✅ BOT PLATFORM DEPLOYMENT COMPLETED"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""
          echo "📦 Version: ${{ github.ref_name }}"
          echo "📝 Commit: ${{ github.sha }}"
          echo "📂 Location: /home/${{ secrets.SERVER_USER }}/app/bot-plattform/"
          echo ""
          echo "🤖 Bots Deployed:"
          echo "  ✅ Twitch Bot  (services/twitch-bot/)"
          echo "  ✅ Discord Bot (services/discord-bot/)"
          echo ""
          echo "📋 Next Steps:"
          echo "  1. SSH to server"
          echo "  2. Edit docker/.env with real credentials"
          echo "  3. Restart bots: docker compose up -d"
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"